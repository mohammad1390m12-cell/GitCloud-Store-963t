name: GitCloud Advanced Engine

on:
  repository_dispatch:
    types: [start_download]

jobs:
  process_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & Aria2
        run: |
          sudo apt-get update && sudo apt-get install -y aria2
          pip install yt-dlp requests

      - name: Smart Download (Direct Link / YouTube / Torrent / Magnet)
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: |
          echo "Starting download for: $TARGET_URL"
          START_TIME=$(date +%s)
          
          if [[ "$TARGET_URL" =~ ^magnet: ]] || [[ "$TARGET_URL" =~ \.torrent$ ]]; then
            echo "Downloading via Aria2 (Torrent/Magnet)..."
            aria2c --seed-time=0 "$TARGET_URL"
          else
            echo "Downloading via yt-dlp / curl..."
            yt-dlp --output "downloaded_file.%(ext)s" "$TARGET_URL" || curl -L -C - -o downloaded_file.rar "$TARGET_URL" || curl -LJO "$TARGET_URL"
          fi
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "DURATION=$DURATION" >> $GITHUB_ENV
          
          FILE_SIZE=$(du -sh downloaded_file* 2>/dev/null | awk '{print $1}')
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          
          for f in downloaded_file*; do
            if [ -f "$f" ]; then
              FILE_SIZE_BYTES=$(stat -c%s "$f")
              MAX_SIZE=$((1800 * 1024 * 1024))
              if [ "$FILE_SIZE_BYTES" -gt "$MAX_SIZE" ]; then
                echo "File is larger than 1.8GB. Splitting..."
                split -b 1800m "$f" "${f}.part"
                rm "$f"
              fi
            fi
          done
          
          ls -la

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}-${{ github.run_id }}
          name: Cloud Download #${{ github.run_number }}
          body: Powered by GitCloud.
          files: downloaded_file*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Webhook Notification to Cloudflare Worker
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DURATION: ${{ env.DURATION }}
          FILE_SIZE: ${{ env.FILE_SIZE }}
          TAG_NAME: file-${{ github.run_number }}-${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_LINK="https://github.com/${REPO}/releases/download/${TAG_NAME}/downloaded_file.rar"
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"$CHAT_ID\", \"duration\": \"$DURATION\", \"file_size\": \"$FILE_SIZE\", \"download_link\": \"$DOWNLOAD_LINK\"}"
