name: GitCloud Engine

on:
  repository_dispatch:
    types: [start_download, create_release]
  workflow_dispatch:

jobs:
  process_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2
          pip install --upgrade yt-dlp

      - name: Download Content
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: |
          URL="${TARGET_URL:-https://youtu.be/gyUFqBm3Q4o?si=bygfG2QiWUTWgSB5}"
          echo "Processing URL: $URL"
          
          # Check if it's a magnet/torrent link
          if [[ "$URL" == magnet:* ]]; then
            echo "Detected magnet link, using aria2..."
            aria2c --bt-metadata-timeout=300 --bt-stop-timeout=300 --seed-time=0 -x 16 -s 16 -k 1M -o "downloaded_file.mp4" "$URL" || true
          # Check if it's a direct link (http/https, not YouTube/social media/pinterest)
          elif [[ "$URL" == http* ]] && [[ ! "$URL" =~ (youtube|youtu\.be|instagram|tiktok|twitter|x\.com|soundcloud|pinterest|pin\.it) ]]; then
            echo "Detected direct link, using aria2..."
            aria2c -x 16 -s 16 -k 1M -o "downloaded_file.mp4" "$URL" || true
          else
            echo "Detected YouTube/Pinterest/social media, using yt-dlp..."
            yt-dlp --no-playlist --extractor-args "youtube:player_client=android" -f "18/best" -o "downloaded_file.mp4" "$URL" || true
          fi
          
          # If file missing or under 1MB, create test video
          python3 -c "
          import os
          if not os.path.exists('downloaded_file.mp4') or os.path.getsize('downloaded_file.mp4') < 1000000:
              print('Download failed or blocked, creating high quality sample video...')
              import subprocess
              subprocess.run([
                  'ffmpeg', '-f', 'lavfi', 
                  '-i', 'testsrc=duration=300:size=1280x720:rate=30', 
                  '-f', 'lavfi', '-i', 'sine=frequency=440:duration=300',
                  '-c:v', 'libx264', '-b:v', '2M', '-c:a', 'aac',
                  '-y', 'downloaded_file.mp4'
              ])
          "
          
          ls -lh downloaded_file.mp4

      - name: Create Release & Auto-Cleanup Old Releases (>12h)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}-${{ github.run_id }}
          name: GitCloud File #${{ github.run_number }}
          body: Powered by GitCloud. Auto-deletes after 12 hours.
          files: downloaded_file.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge Releases Older Than 12 Hours
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import urllib.request
          import json
          import datetime

          repo = '${{ github.repository }}'
          token = '${{ secrets.GITHUB_TOKEN }}'
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github.v3+json', 'User-Agent': 'GitCloud-Cleanup'}

          url = f'https://api.github.com/repos/{repo}/releases?per_page=30'
          req = urllib.request.Request(url, headers=headers)
          try:
              releases = json.loads(urllib.request.urlopen(req).read().decode())
              now = datetime.datetime.utcnow()
              for rel in releases:
                  pub_date_str = rel['published_at'].replace('Z', '')
                  pub_date = datetime.datetime.fromisoformat(pub_date_str)
                  age_hours = (now - pub_date).total_seconds() / 3600
                  if age_hours > 12:
                      rel_id = rel['id']
                      tag = rel['tag_name']
                      print(f'Deleting old release {tag} (age: {age_hours:.1f} hours)...')
                      # Delete release
                      del_url = f'https://api.github.com/repos/{repo}/releases/{rel_id}'
                      urllib.request.urlopen(urllib.request.Request(del_url, headers=headers, method='DELETE'))
                      # Delete tag
                      tag_url = f'https://api.github.com/repos/{repo}/git/refs/tags/{tag}'
                      try:
                          urllib.request.urlopen(urllib.request.Request(tag_url, headers=headers, method='DELETE'))
                      except:
                          pass
          except Exception as e:
              print('Cleanup error:', e)
          "

      - name: Send Webhook Notification
        if: always()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url || 'https://gitcloud.modern-tools.ir/webhook/github-done' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || '7645510290' }}
          TAG_NAME: file-${{ github.run_number }}-${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          FILE_SIZE=$(du -sh downloaded_file.mp4 2>/dev/null | awk '{print $1}' || echo "N/A")
          DOWNLOAD_LINK="https://github.com/${REPO}/releases/download/${TAG_NAME}/downloaded_file.mp4"
          echo "Webhook payload: chat_id=$CHAT_ID, download_link=$DOWNLOAD_LINK"
          curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"chat_id\": \"$CHAT_ID\", \"duration\": \"12 hours\", \"file_size\": \"$FILE_SIZE\", \"download_link\": \"$DOWNLOAD_LINK\"}" || true
